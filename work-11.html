<title>电视机人处决演示</title>
<style>
:root{--bg:#08080b;--fg:#dde1e7;--mut:#7f8794;--line:#252a34;--acc:#e8474a}
html{color-scheme:dark}*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#wrap{max-width:1280px;margin:0 auto;padding:12px 16px 24px}
h1{font-size:18px;font-weight:600;margin:4px 0 10px}
#stageBox{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:6px;background:#000}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
#ctl button{background:#151922;color:var(--fg);border:1px solid var(--line);padding:8px 12px;border-radius:4px;font:inherit;font-size:13px;cursor:pointer}
#ctl button.on{border-color:var(--acc);color:#ff8a8c}
#scrub{flex:1;min-width:200px}
#tt{font:12px Consolas,monospace;color:var(--mut);min-width:90px}
#beats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#beats button{background:#10131a;color:var(--mut);border:1px solid var(--line);padding:4px 8px;border-radius:3px;font-size:12px;cursor:pointer;font-family:inherit}
#beats button.on{color:#ffd0d0;border-color:#7a3036}
#notes{margin-top:12px;font-size:13px;color:var(--mut);line-height:1.75;max-width:1000px}
#notes b{color:var(--fg)}
.rec-mode #ctl,.rec-mode #notes,.rec-mode h1,.rec-mode #beats{display:none}
.rec-mode #wrap{padding:0;max-width:none}.rec-mode #stageBox{border-radius:0}
</style>
<div id="wrap">
<h1>电视机人 · 处决演示</h1>
<div id="stageBox"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="ctl">
 <button id="bPlay" class="on">❚❚ 暂停</button>
 <input id="scrub" type="range" min="0" max="11.8" step="0.01" value="0">
 <span id="tt">0.00s</span>
 <button id="bSnd">🔈 开启声音</button>
 <button id="bLab" class="on">节拍字幕</button>
</div>
<div id="beats"></div>
<div id="notes">
<b>流程</b>：大手抓起玩家的同时，9 只红眼逐一锁定并变成漩涡，把蓝色灵魂吸进屏幕 → 九块屏幕拼成一张大画面，玩家在里面惊慌失措、拍打屏幕，每拍一下留下手印和裂纹 → 第三下拍出故障，裂成 9 块小屏，同时播放她拍打屏幕的画面 → 屏幕狂闪后变成雪花，只剩左上角 → 左上角里她静止片刻，然后摆出呐喊姿势 → 呐喊从左到右、从上到下逐屏同步 → 9 屏拼成一张大画面 → CRT 关机 → 外部镜头，尸体被丢下，左上角的屏幕里闪过她呐喊的脸。
</div>

function arm(p,side){

 const o={};for(const key of new Set([...Object.keys(a),...Object.keys(b)])){const va=a[key],vb=b[key];
  if(typeof va==='number'||typeof vb==='number')o[key]=lerp(va||0,vb||0,k);

  else o[key]=k<.5?(va??vb):(vb??va)}
